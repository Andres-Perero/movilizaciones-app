<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Movilizaciones Pro</title>
    
    <!-- FAVICON INLINE -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'></text></svg>">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
      :root {
        --primary: #3b82f6;
        --primary-dark: #2563eb;
        --bg: #f8fafc;
        --card: #ffffff;
        --text: #0f172a;
        --text-muted: #64748b;
        --border: #e2e8f0;
        --danger: #ef4444;
        --success: #10b981;
        --radius: 16px;
        --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      }

      body.dark-mode {
        --bg: #1e293b;
        --card: #334155;
        --text: #f1f5f9;
        --text-muted: #94a3b8;
        --border: #475569;
        --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Inter", system-ui, sans-serif;
        -webkit-tap-highlight-color: transparent;
        transition: background 0.3s, color 0.3s;
      }

      body {
        background: var(--bg);
        color: var(--text);
        padding-bottom: 40px;
        min-height: 100vh;
      }

      /* HEADER */
      header {
        background: var(--card);
        padding: 1rem 1.25rem;
        position: sticky;
        top: 0;
        z-index: 50;
        box-shadow: var(--shadow);
        border-bottom: 1px solid var(--border);
      }
      .header-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.75rem;
      }
      h1 {
        font-size: 1.2rem;
        font-weight: 800;
        letter-spacing: -0.5px;
      }

      .btn-theme {
        background: transparent;
        border: none;
        width: 48px;
        height: 48px;
        border-radius: 12px;
        font-size: 1.6rem;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: var(--text);
      }
      .btn-theme:hover {
        background: var(--bg);
      }

      .date-control {
        margin-bottom: 0.75rem;
      }
      input[type="date"] {
        width: 100%;
        padding: 12px;
        border-radius: 12px;
        border: 1px solid var(--border);
        font-size: 1rem;
        font-weight: 600;
        background: var(--bg);
        color: var(--text);
        text-align: center;
      }

      /* TABS */
      .tabs {
        display: flex;
        background: var(--bg);
        padding: 4px;
        border-radius: 12px;
        gap: 4px;
      }
      .tab {
        flex: 1;
        padding: 10px;
        text-align: center;
        border-radius: 10px;
        font-size: 0.85rem;
        font-weight: 700;
        color: var(--text-muted);
        cursor: pointer;
        transition: all 0.2s;
        border: none;
        background: transparent;
      }
      .tab.active {
        background: var(--card);
        color: var(--primary);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      }

      /* MAIN CONTENT */
      main {
        padding: 1rem 1.25rem;
        max-width: 600px;
        margin: 0 auto;
      }
      .view-section {
        display: none;
        animation: fadeIn 0.3s ease;
      }
      .view-section.active {
        display: block;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(5px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* DAY CARDS */
      .day-card {
        background: var(--card);
        border-radius: var(--radius);
        padding: 1.25rem;
        margin-bottom: 1rem;
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
      }
      .day-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 1rem;
      }
      .day-name {
        font-weight: 800;
        font-size: 1.1rem;
        color: var(--primary);
        text-transform: uppercase;
      }
      .day-date {
        font-size: 0.85rem;
        color: var(--text-muted);
        font-weight: 500;
      }

      .mob-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 0;
        border-bottom: 1px dashed var(--border);
      }
      .mob-item:last-child { border-bottom: none; }
      .mob-info { flex: 1; padding-right: 10px; }
      .mob-name { font-weight: 600; font-size: 0.95rem; }
      .mob-obs { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; font-style: italic; }
      .mob-price { font-weight: 700; font-size: 1rem; margin-right: 10px; }
      .btn-del {
        background: rgba(239, 68, 68, 0.1);
        color: var(--danger);
        border: none;
        width: 32px;
        height: 32px;
        border-radius: 8px;
        font-size: 1.2rem;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .btn-add {
        width: 100%;
        background: var(--bg);
        color: var(--primary);
        border: 2px dashed var(--border);
        padding: 14px;
        border-radius: 12px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 1rem;
        transition: all 0.2s;
      }
      .btn-add:active {
        background: rgba(59, 130, 246, 0.1);
        border-color: var(--primary);
      }

      /* SUMMARY TABLE */
      .summary-container {
        background: var(--card);
        border-radius: var(--radius);
        overflow: hidden;
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
        padding: 1rem;
        margin-bottom: 1rem;
      }
      .summary-table { width: 100%; border-collapse: collapse; }
      .summary-table th {
        background: var(--primary);
        color: white;
        padding: 12px 16px;
        text-align: left;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .summary-table td {
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
        font-size: 0.95rem;
      }
      .summary-table tr:last-child td { border-bottom: none; }
      .col-price { text-align: right; font-weight: 700; white-space: nowrap; width: 80px; }
      .col-day { font-weight: 700; color: var(--primary); width: 70px; }

      .total-row { background: rgba(59, 130, 246, 0.05) !important; }
      .total-row td {
        font-size: 1.2rem;
        font-weight: 800;
        color: var(--text);
        border-top: 2px solid var(--border);
        padding-top: 16px;
      }

      /* MODAL */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(4px);
        display: none;
        justify-content: center;
        align-items: flex-end;
        z-index: 100;
        padding: 1rem;
      }
      .modal-overlay.active { display: flex; }
      .modal-sheet {
        background: var(--card);
        width: 100%;
        max-width: 500px;
        border-radius: 24px 24px 0 0;
        padding: 1.5rem;
        animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }
      @keyframes slideUp {
        from { transform: translateY(100%); }
        to { transform: translateY(0); }
      }

      .form-group { margin-bottom: 1.2rem; }
      .form-label {
        display: block;
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--text-muted);
        margin-bottom: 6px;
        text-transform: uppercase;
      }
      
      .input-with-btn { display: flex; gap: 8px; }
      .input-with-btn input { flex: 1; }
      .btn-suggest {
        background: var(--bg);
        border: 2px solid var(--border);
        border-radius: 12px;
        padding: 0 16px;
        font-size: 1.2rem;
        cursor: pointer;
        color: var(--text-muted);
      }

      .form-input {
        width: 100%;
        padding: 14px;
        border: 2px solid var(--border);
        border-radius: 12px;
        font-size: 1rem;
        background: var(--bg);
        color: var(--text);
        transition: border-color 0.2s;
      }
      .form-input:focus {
        outline: none;
        border-color: var(--primary);
        background: var(--card);
      }

      .suggestions-list {
        max-height: 200px;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: 12px;
        margin-top: 8px;
        display: none;
        background: var(--card);
      }
      .suggestions-list.active { display: block; }
      .suggestion-item {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .suggestion-item:last-child { border-bottom: none; }
      .suggestion-item:active { background: var(--bg); }
      .sug-name { font-weight: 600; font-size: 0.95rem; }
      .sug-price { color: var(--text-muted); font-size: 0.9rem; }

      .modal-actions { display: flex; gap: 10px; margin-top: 1.5rem; }
      .btn-modal {
        flex: 1;
        padding: 16px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 1rem;
        border: none;
        cursor: pointer;
      }
      .btn-cancel { background: var(--bg); color: var(--text-muted); }
      .btn-save { background: var(--primary); color: white; }

      /* ACTION BUTTONS */
      .action-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 1rem;
      }
      .btn-action {
        padding: 14px;
        border-radius: 12px;
        border: none;
        font-weight: 700;
        font-size: 0.9rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .btn-copy-txt { background: var(--text); color: var(--bg); }
      .btn-copy-img { background: var(--primary); color: white; }
      .btn-clear {
        background: rgba(239, 68, 68, 0.1);
        color: var(--danger);
        grid-column: span 2;
        margin-top: 5px;
      }

      /* TOAST */
      .toast {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%) translateY(-100px);
        background: var(--text);
        color: var(--bg);
        padding: 12px 24px;
        border-radius: 50px;
        font-weight: 600;
        font-size: 0.9rem;
        z-index: 200;
        transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      }
      .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
  </head>
  <body>
    <header>
      <div class="header-top">
        <h1>Movilizaciones</h1>
        <button class="btn-theme" onclick="toggleTheme()" id="themeBtn" aria-label="Cambiar tema">
          🌙
        </button>
      </div>

      <div class="date-control">
        <input type="date" id="datePicker" />
      </div>

      <div class="tabs">
        <button class="tab active" onclick="switchTab('days')"> Por Día</button>
        <button class="tab" onclick="switchTab('summary')">📊 Resumen</button>
      </div>
    </header>

    <main>
      <div id="view-days" class="view-section active"></div>

      <div id="view-summary" class="view-section">
        <div class="summary-container" id="captureArea">
          <div style="padding: 0 16px 10px 16px; border-bottom: 1px solid var(--border); margin-bottom: 10px;">
            <h3 style="font-size: 1.1rem; font-weight: 800; color: var(--primary)" id="summaryTitle">Resumen Semanal</h3>
            <p style="font-size: 0.85rem; color: var(--text-muted)" id="summarySubtitle">Semana actual</p>
          </div>
          <table class="summary-table">
            <thead>
              <tr>
                <th>Día</th>
                <th>Local / Destino</th>
                <th class="col-price">Monto</th>
              </tr>
            </thead>
            <tbody id="summaryBody"></tbody>
          </table>
        </div>

        <div class="action-grid">
          <button class="btn-action btn-copy-txt" onclick="copyText()"> Copiar Texto</button>
          <button class="btn-action btn-copy-img" onclick="copyImage()">️ Copiar Img</button>
          <button class="btn-action btn-clear" onclick="clearWeek()">🗑️ Borrar Esta Semana</button>
        </div>
      </div>
    </main>

    <!-- MODAL AGREGAR -->
    <div class="modal-overlay" id="modal">
      <div class="modal-sheet">
        <h3 style="margin-bottom: 1.5rem; font-size: 1.2rem">Nueva Movilización</h3>

        <div class="form-group">
          <label class="form-label">Destino (Editable)</label>
          <div class="input-with-btn">
            <input type="text" id="locInput" class="form-input" placeholder="Escribe o selecciona..." autocomplete="off" />
            <button class="btn-suggest" onclick="toggleSuggestions()" title="Ver lista de locales"></button>
          </div>
          <div class="suggestions-list" id="suggestionsList"></div>
        </div>

        <div class="form-group">
          <label class="form-label">Precio ($)</label>
          <input type="number" id="priceInput" class="form-input" step="0.10" inputmode="decimal" />
        </div>

        <div class="form-group">
          <label class="form-label">Observación (Opcional)</label>
          <input type="text" id="obsInput" class="form-input" placeholder="Ej: Viaje extra..." />
        </div>

        <div class="modal-actions">
          <button class="btn-modal btn-cancel" onclick="closeModal()">Cancelar</button>
          <button class="btn-modal btn-save" onclick="saveEntry()">Guardar</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast">¡Copiado!</div>

    <script>
      const LOCATIONS = [
        { n: "PIADY", p: 6.0 },
        { n: "PROMARISCOS", p: 8.5 },
        { n: "ALMAR(LIMBOMAR)", p: 8.5 },
        { n: "LOS CEIBOS", p: 3.0 },
        { n: "MALL DEL SUR", p: 3.0 },
        { n: "MAPASINGUE", p: 2.5 },
        { n: "DOMINGO COMIN", p: 3.0 },
        { n: "GRAN AKI MAPASINGUE", p: 1.2 },
        { n: "POLICENTRO", p: 3.0 },
        { n: "GARZOTA", p: 3.0 },
        { n: "VILLAGE PLAZA", p: 4.0 },
        { n: "BATÁN", p: 4.0 },
        { n: "ASTILLERO", p: 3.5 },
        { n: "DURÁN", p: 4.0 },
        { n: "ALBAN BORJA", p: 1.2 },
        { n: "MUCHO LOTE", p: 3.0 },
        { n: "TERMINAL", p: 3.0 },
        { n: "SIETE ENE VIA A LA COSTA", p: 4.5 },
        { n: "LIRIS ALBORADA", p: 3.5 },
        { n: "LIRIS VILLA CLUB", p: 4.5 },
        { n: "LIRIS GOMEZ RENDON", p: 3.0 },
        { n: "LIRIS PPG", p: 2.0 },
        { n: "LIRIS PIAZZA", p: 2.0 },
        { n: "LIRIS ORELLANA", p: 2.5 },
        { n: "LIRIS PLANTA km 40 A LA COSTA", p: 8.5 },
        { n: "LIRIS VIA A LA COSTA", p: 6.5 },
        { n: "LIRIS BOSQUE DE LA COSTA", p: 6.5 },
        { n: "LIRIS CRISTO DEL CONSUELO", p: 3.5 },
        { n: "BASE SUR", p: 3.0 },
        { n: "OMARSA", p: 3.0 },
        { n: "BODEGA FRISERTEC", p: 2.0 },
        { n: "MILAGRO", p: 6.2 },
        { n: "BABAROYO", p: 15.0 },
        { n: "AKI DAULE", p: 9.7 },
        { n: "EMPALME", p: 19.0 },
        { n: "PLAYAS", p: 19.0 },
        { n: "VINCES", p: 25.0 },
        { n: "HUAQUILLAS", p: 30.0 },
        { n: "QUEVEDO", p: 25.5 },
      ];

      let currentWeekStart = "";
      let activeDayDate = "";
      let db = JSON.parse(localStorage.getItem("mov_db_v5")) || {};

      function getMonday(d) {
        d = new Date(d);
        const day = d.getDay();
        const diff = d.getDate() - day + (day === 0 ? -6 : 1);
        return new Date(d.setDate(diff));
      }

      function fmtDate(d) {
        return d.toISOString().split("T")[0];
      }

      function getWeekDates(mon) {
        const arr = [];
        for (let i = 0; i < 7; i++) {
          const d = new Date(mon);
          d.setDate(d.getDate() + i);
          arr.push(d);
        }
        return arr;
      }

      function init() {
        // Cargar tema guardado
        if (localStorage.getItem("theme") === "dark") {
          document.body.classList.add("dark-mode");
          document.getElementById("themeBtn").innerText = "☀️";
        }

        // Configurar calendario con HOY seleccionado
        const picker = document.getElementById("datePicker");
        const today = new Date();
        
        // Setear el input a HOY
        picker.value = fmtDate(today);
        
        // Calcular el lunes de la semana de HOY para la vista interna
        currentWeekStart = fmtDate(getMonday(today));

        picker.addEventListener("change", (e) => {
          // Cuando el usuario cambia la fecha, recalculamos el lunes de ESA nueva fecha
          currentWeekStart = fmtDate(getMonday(new Date(e.target.value)));
          renderAll();
        });

        renderSuggestions();
        renderAll();
      }

      function renderSuggestions() {
        const list = document.getElementById("suggestionsList");
        list.innerHTML = "";
        LOCATIONS.forEach((l) => {
          const item = document.createElement("div");
          item.className = "suggestion-item";
          item.innerHTML = `<span class="sug-name">${l.n}</span><span class="sug-price">$${l.p.toFixed(2)}</span>`;
          item.onclick = () => selectSuggestion(l);
          list.appendChild(item);
        });
      }

      function toggleSuggestions() {
        document.getElementById("suggestionsList").classList.toggle("active");
      }

      function selectSuggestion(loc) {
        document.getElementById("locInput").value = loc.n;
        document.getElementById("priceInput").value = loc.p;
        document.getElementById("suggestionsList").classList.remove("active");
      }

      function renderAll() {
        renderDaysView();
        renderSummaryView();
      }

      function switchTab(tab) {
        document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
        document.querySelectorAll(".view-section").forEach((v) => v.classList.remove("active"));

        if (tab === "days") {
          document.querySelector(".tab:nth-child(1)").classList.add("active");
          document.getElementById("view-days").classList.add("active");
        } else {
          document.querySelector(".tab:nth-child(2)").classList.add("active");
          document.getElementById("view-summary").classList.add("active");
          renderSummaryView();
        }
      }

      function toggleTheme() {
        document.body.classList.toggle("dark-mode");
        const isDark = document.body.classList.contains("dark-mode");
        localStorage.setItem("theme", isDark ? "dark" : "light");
        document.getElementById("themeBtn").innerText = isDark ? "☀️" : "";
      }

      function renderDaysView() {
        const container = document.getElementById("view-days");
        container.innerHTML = "";
        // Usamos currentWeekStart que siempre es el Lunes calculado
        const dates = getWeekDates(new Date(currentWeekStart));

        dates.forEach((d) => {
          const ds = fmtDate(d);
          const dayName = d.toLocaleDateString("es-ES", { weekday: "long" });
          const entries = db[ds] || [];

          const card = document.createElement("div");
          card.className = "day-card";

          let itemsHtml = "";
          if (entries.length === 0) {
            itemsHtml = '<div style="text-align:center; color:var(--text-muted); padding:1rem; font-style:italic; font-size:0.9rem;">Sin registros</div>';
          } else {
            entries.forEach((e, idx) => {
              itemsHtml += `
                <div class="mob-item">
                  <div class="mob-info">
                    <div class="mob-name">${e.l}</div>
                    ${e.o ? `<div class="mob-obs">${e.o}</div>` : ""}
                  </div>
                  <div style="display:flex; align-items:center;">
                    <span class="mob-price">$${parseFloat(e.p).toFixed(2)}</span>
                    <button class="btn-del" onclick="delItem('${ds}',${idx})">×</button>
                  </div>
                </div>`;
            });
          }

          card.innerHTML = `
            <div class="day-header">
              <div>
                <div class="day-name">${dayName}</div>
                <div class="day-date">${d.getDate()} de ${d.toLocaleString("es", { month: "long" })}</div>
              </div>
            </div>
            ${itemsHtml}
            <button class="btn-add" onclick="openModal('${ds}')">+ Agregar Movilización</button>`;
          container.appendChild(card);
        });
      }

      function renderSummaryView() {
        const tbody = document.getElementById("summaryBody");
        tbody.innerHTML = "";
        const dates = getWeekDates(new Date(currentWeekStart));
        let total = 0;

        document.getElementById("summaryTitle").innerText = "Reporte Semanal";
        document.getElementById("summarySubtitle").innerText =
          `Del ${dates[0].toLocaleDateString("es-ES")} al ${dates[6].toLocaleDateString("es-ES")}`;

        dates.forEach((d) => {
          const ds = fmtDate(d);
          const entries = db[ds] || [];
          const dayShort = d.toLocaleDateString("es-ES", { weekday: "short" }).replace(".", "");

          if (entries.length > 0) {
            entries.forEach((e) => {
              const price = parseFloat(e.p);
              total += price;
              const tr = document.createElement("tr");
              tr.innerHTML = `
                <td class="col-day">${dayShort}</td>
                <td>${e.l} ${e.o ? `<small style="color:var(--text-muted)">(${e.o})</small>` : ""}</td>
                <td class="col-price">$${price.toFixed(2)}</td>`;
              tbody.appendChild(tr);
            });
          }
        });

        const trTotal = document.createElement("tr");
        trTotal.className = "total-row";
        trTotal.innerHTML = `
          <td colspan="2" style="text-align:right; padding-right:20px;">TOTAL SEMANA:</td>
          <td class="col-price" style="font-size:1.3rem;">$${total.toFixed(2)}</td>`;
        tbody.appendChild(trTotal);
      }

      function openModal(ds) {
        activeDayDate = ds;
        document.getElementById("modal").classList.add("active");
        document.getElementById("locInput").value = "";
        document.getElementById("priceInput").value = "";
        document.getElementById("obsInput").value = "";
        document.getElementById("suggestionsList").classList.remove("active");
        setTimeout(() => document.getElementById("locInput").focus(), 100);
      }

      function closeModal() {
        document.getElementById("modal").classList.remove("active");
      }

      function saveEntry() {
        const l = document.getElementById("locInput").value.trim();
        const p = parseFloat(document.getElementById("priceInput").value) || 0;
        const o = document.getElementById("obsInput").value.trim();

        if (!l) { alert("Por favor ingresa un destino"); return; }

        if (!db[activeDayDate]) db[activeDayDate] = [];
        db[activeDayDate].push({ l, p, o });

        localStorage.setItem("mov_db_v5", JSON.stringify(db));
        closeModal();
        renderAll();
      }

      function delItem(ds, idx) {
        if (confirm("¿Eliminar esta entrada?")) {
          db[ds].splice(idx, 1);
          if (db[ds].length === 0) delete db[ds];
          localStorage.setItem("mov_db_v5", JSON.stringify(db));
          renderAll();
        }
      }

      function clearWeek() {
        if (confirm("️ ¿Borrar TODA la semana actual?")) {
          getWeekDates(new Date(currentWeekStart)).forEach((d) => delete db[fmtDate(d)]);
          localStorage.setItem("mov_db_v5", JSON.stringify(db));
          renderAll();
          showToast("Semana borrada");
        }
      }

      function copyText() {
        const dates = getWeekDates(new Date(currentWeekStart));
        let txt = `*MOVILIZACIONES SEMANA*\n`;
        txt += `Del ${dates[0].toLocaleDateString("es-ES")} al ${dates[6].toLocaleDateString("es-ES")}\n\n`;

        let total = 0;
        let hasData = false;

        dates.forEach((d) => {
          const ds = fmtDate(d);
          const entries = db[ds] || [];
          if (entries.length > 0) {
            hasData = true;
            const dayShort = d.toLocaleDateString("es-ES", { weekday: "short" }).toUpperCase();
            entries.forEach((e) => {
              txt += `${dayShort} | ${e.l.padEnd(25)} $${parseFloat(e.p).toFixed(2)}`;
              if (e.o) txt += ` (${e.o})`;
              txt += `\n`;
              total += parseFloat(e.p);
            });
          }
        });

        if (!hasData) { showToast("No hay datos"); return; }

        txt += `\n----------------------------\n`;
        txt += `*TOTAL: $${total.toFixed(2)}*`;

        navigator.clipboard.writeText(txt).then(() => showToast("✅ Texto copiado"));
      }

      async function copyImage() {
        const element = document.getElementById("captureArea");
        try {
          const canvas = await html2canvas(element, {
            scale: 2,
            backgroundColor: document.body.classList.contains("dark-mode") ? "#334155" : "#ffffff",
            useCORS: true,
          });

          canvas.toBlob(async (blob) => {
            if (!blob) { showToast("Error generando imagen"); return; }
            try {
              await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
              showToast("✅ Imagen copiada! Pégala donde quieras");
            } catch (err) {
              const link = document.createElement("a");
              link.download = `movilizaciones_${currentWeekStart}.png`;
              link.href = canvas.toDataURL();
              link.click();
              showToast("️ Imagen descargada");
            }
          });
        } catch (err) {
          console.error(err);
          showToast("Error al generar imagen");
        }
      }

      function showToast(msg) {
        const t = document.getElementById("toast");
        t.innerText = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 2500);
      }

      document.getElementById("modal").addEventListener("click", (e) => {
        if (e.target.id === "modal") closeModal();
      });

      document.addEventListener("click", (e) => {
        const list = document.getElementById("suggestionsList");
        const btn = document.querySelector(".btn-suggest");
        if (!list.contains(e.target) && e.target !== btn) {
          list.classList.remove("active");
        }
      });

      init();
    </script>
  </body>
</html>
